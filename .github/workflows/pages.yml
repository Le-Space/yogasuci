name: Handbook to GitHub Pages

# The user handbook, published on its own. Separate from the Aleph deploy on
# purpose: that one carries the app and needs DNS, this one needs neither and is
# therefore the URL that works today.
#
# Pages is already set to "GitHub Actions" as its source on this repository, so
# nothing has to be switched on by hand. I claimed the opposite when writing this
# and the API said otherwise; the note stays as the corrected version rather than
# being deleted, because the next person will wonder the same thing.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a running one finish: a half-published handbook is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, and enough history to reach the last one: the footer names the
          # release this build is at or past (scripts/build-version.mjs), and a
          # shallow clone brings none. Without this the deployed app silently
          # drops its version and looks fine doing it.
          fetch-depth: 0

      # No `version:` here. `packageManager` in package.json already pins it, and
      # naming it twice is an error rather than a preference — which is how this
      # workflow failed twice before anybody looked: it is only triggered by
      # changes under docs-site/, so its red runs were not in front of a PR.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # From the repository root, and by name rather than by directory.
      #
      # docs-site is a workspace package now, so its dependencies live in the
      # root lockfile and an install inside the directory is not the same thing
      # any more: pnpm resolves to the workspace root and installs nothing while
      # reporting success. That is exactly how #115 broke the deploy, and this
      # workflow is the other consumer that would have hit it — it only runs on
      # changes under docs-site/, so a red run here is not in front of a PR.
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter yogasuci-docs build
        env:
          DOCS_URL: https://le-space.github.io
          DOCS_BASE_URL: /yogasuci/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
