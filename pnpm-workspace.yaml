# The handbook is a workspace package, and the settings below live here because
# pnpm 10.33 no longer reads the `pnpm` field of package.json — it warns that the
# keys were ignored and carries on without them, which is the silent kind of
# failure: the override simply stops applying.
#
# Declaring `packages` is not optional once this file exists. Its mere presence
# makes the repository a workspace, and that changes what an install in a
# subdirectory means: `pnpm --dir docs-site install` resolves to the workspace
# root, finds docs-site is not a member, installs nothing, and reports success.
# The deploy then fails at `docusaurus: not found` while CI stays green, because
# CI does not build the handbook. That is how #115 broke publishing.
#
# So docs-site is a member, its dependencies live in the root lockfile, and
# `build:handbook` asks for it by name instead of installing in place.
packages:
  - docs-site

overrides:
  '@le-space/orbitdb-identity-provider-webauthn-did': 0.5.1

onlyBuiltDependencies:
  - esbuild
